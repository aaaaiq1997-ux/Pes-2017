
name: Build PES 2017 APK

on:
  workflow_dispatch:
  push:
    paths:
      - '*.zip'
      - '.github/workflows/main.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract project
        run: |
          mkdir project
          ZIP=$(find . -maxdepth 1 -name '*.zip' -print -quit)
          test -n "$ZIP"
          unzip -q "$ZIP" -d project
          GRADLEW=$(find project -name gradlew -type f -print -quit)
          test -n "$GRADLEW"
          echo "ANDROID_DIR=$(dirname "$GRADLEW")" >> "$GITHUB_ENV"

      - name: Build APK
        run: |
          cd "$ANDROID_DIR"
          chmod +x gradlew
          ./gradlew :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PES-2017-APK
          path: project/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
